name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Linter (ESLint)
        run: npm run lint || true

  build-and-test:
    name: Automated Tests & Production Build
    needs: lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Execute Automated Test Suite (npm test)
        env:
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/ci_test_db
          JWT_SECRET: charusat_ci_cd_test_secret_key_2026
        run: npm test

      - name: Compile Production Bundle (npm run build)
        run: npm run build
