services:
  # -------------------------------------------------------------
  # 1. MongoDB Database Container
  # -------------------------------------------------------------
  mongodb:
    image: mongo:6
    container_name: practical12-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: taskdb
    volumes:
      # Supplementary Problem 3: Named persistent volume for data durability
      - mongo-data:/data/db
    networks:
      - app-network

  # -------------------------------------------------------------
  # 2. Node.js / Express REST API Backend
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: practical12-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      # Critical Architecture Concept: Inter-container networking references service name 'mongodb'
      MONGO_URI: mongodb://mongodb:27017/taskdb
      JWT_SECRET: charusat_itue301_practical12_jwt_secret_key_2026
      NODE_ENV: production
      DOCKER_CONTAINER: "true"
      NOTIFICATION_DELAY_MS: "1500"
    depends_on:
      - mongodb
    networks:
      - app-network

  # -------------------------------------------------------------
  # 3. React Frontend UI (Multi-Stage Build)
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: practical12-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - app-network

# ---------------------------------------------------------------
# Bridge Network: Enables inter-container DNS and traffic routing
# ---------------------------------------------------------------
networks:
  app-network:
    driver: bridge

# ---------------------------------------------------------------
# Named Persistent Volume: Persists MongoDB documents across restarts
# ---------------------------------------------------------------
volumes:
  mongo-data:
    driver: local
